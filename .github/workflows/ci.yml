name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck, build, test and check formatting
        run: |
          docker run --rm -e HUSKY=0 -e ASTRO_TELEMETRY_DISABLED=1 -v "$PWD:/app" -w /app oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d sh -c 'bun install --frozen-lockfile && bun run typecheck && bun run build && bun run test && bun run format:check'
      - name: Build production image
        run: docker build --build-arg RADIO_MAX_REVISION="$GITHUB_SHA" -t radio-max:ci .
      - name: Test deployment hooks
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Test webhook receiver
        run: |
          docker run --rm -v "$PWD/deploy/receiver:/app:ro" -w /app \
            node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f \
            node --test server.test.mjs
      - name: Validate private origin and public relay configuration
        run: |
          docker compose -f deploy/compose.origin.yaml config --quiet
          docker run --rm -v "$PWD/deploy/relay/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e RADIO_MAX_RELAY_TOKEN=ci-validation-placeholder \
            caddy:2.11.7@sha256:8dc9fa87b36b25303d1c67d2a09f5824b7f3bfd72cb052f246e5da2133fe29a8 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v "$PWD/deploy/relay/Caddyfile.public:/etc/caddy/Caddyfile:ro" \
            -e RADIO_MAX_RELAY_TOKEN=ci-validation-placeholder \
            caddy:2.11.7@sha256:8dc9fa87b36b25303d1c67d2a09f5824b7f3bfd72cb052f246e5da2133fe29a8 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify the restricted production container and streaming API
        run: |
          export RADIO_MAX_IMAGE=radio-max:ci
          export STREAM_HOSTS=localhost,127.0.0.1,radio-max
          docker compose config --quiet
          docker network create platform-web
          trap 'docker compose down; docker network rm platform-web' EXIT
          docker compose up -d --wait --wait-timeout 90
          docker compose exec -T -e VERIFY_EXCLUSIVE=true web bun /app/deploy/verify.ts
      - name: Verify authenticated origin and client limits through two proxies
        run: |
          python3 -B deploy/check-stream-proxy.py
          python3 -B deploy/check-stream-proxy.py --public-edge
